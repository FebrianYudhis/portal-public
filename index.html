<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portal Tautan</title>
    <meta
      name="description"
      content="Kumpulan tautan penting dalam satu halaman."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="linktree" aria-label="Microsite tautan">
        <div class="noise" aria-hidden="true"></div>
        <div class="ticket-head">
          <div class="avatar" id="avatar" aria-hidden="true"></div>
          <span class="tag">Link Cepat</span>
        </div>
        <div class="intro">
          <h1 id="siteTitle"></h1>
          <p class="bio" id="siteBio"></p>
          <div class="stamp" id="stamp" aria-hidden="true"></div>
        </div>
        <hr class="perf-line" aria-hidden="true" />
        <div class="links" id="links"></div>
        <div class="ticket-footer" aria-hidden="true">
          <span class="serial" id="serial"></span>
          <div class="barcode" id="barcode"></div>
        </div>
      </section>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
